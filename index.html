<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Cards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 12px;
            border-bottom: 1px solid firebrick;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        section {
            padding: 15px;
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .card {
            border: 1px solid firebrick;
            border-radius: 12px;
            padding: 12px;
            /* margin-bottom: 15px; */
        }

        .tag {
            font-size: 20px;
            color: #662323;
        }

        .title {
            font-weight: bold;
            margin: 7px 0;
        }

        @media (min-width: 700px) {
            .featured {
                grid-column: span 2;
                grid-row: span 2;
            }
        }

        .hidden {
            display: none;
        }

    </style>
</head>
<body>
    <header>
        <div>Movie Cards</div>
        <label for="genre">
            Genre:
            <select id="genre">
                <option value="all">All</option>
                <option value="action">Action</option>
                <option value="scifi">Sci-Fi</option>
                <option value="drama">Drama</option>
            </select>
        </label>
    </header>

    <section class="grid">
        <article class="card featured" data-genre="scifi">
            <div class="tag">Sci-Fi (Featured)</div>
            <div class="title">Interstellar</div>
            <div>This card spans bigger on wider screens</div>
        </article>
        <article class="card" data-genre="action">
            <div class="tag">Action</div>
            <div class="title">Fast & Furious</div>
            <div>Just a regular card</div>
        </article>
        <article class="card" data-genre="comedy">
            <div class="tag">Comedy</div>
            <div class="title">Wedding Crashers</div>
            <div>Just a regular card</div>
        </article>
        <article class="card" data-genre="drama">
            <div class="tag">Drama</div>
            <div class="title">The Shawshank Redemption</div>
            <div>Just a regular card</div>
        </article>
    </section>

    <script src="script.js"></script>
</body>
</html>
